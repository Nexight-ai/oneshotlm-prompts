# Job A — on merge to main, find models newly added to live.csv that have no runs
# yet in the app repo, and kick the Cloudflare orchestrator. Fire-and-forget: the
# PR-builder (app repo, cron) picks the run-set up when generation completes.
name: trigger-generation
on:
  push:
    branches: [main]
    paths: ["models/live.csv"]
  workflow_dispatch:
    inputs:
      model:
        description: "Exact live model ID to run (blank checks all incomplete models)"
        required: false
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/checkout@v4
        with: { path: prompts }

      # App token so we can read the (private) app repo to see what already has runs.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.OSLM_BOT_APP_ID }}
          private-key: ${{ secrets.OSLM_BOT_PRIVATE_KEY }}
          repositories: oneshotlm.com

      - uses: actions/checkout@v4
        with:
          repository: Nexight-ai/oneshotlm.com
          token: ${{ steps.app-token.outputs.token }}
          path: app
          sparse-checkout: |
            data/runs
            runner/runs.config.json
            shared
          sparse-checkout-cone-mode: false

      - name: Install shared prompt parser
        run: npm ci --prefix app/shared

      - name: Compute new models
        id: diff
        env:
          REQUESTED_MODEL: ${{ inputs.model }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { runId } from "./app/shared/identity.js";
            const live = fs.readFileSync("prompts/models/live.csv", "utf8").trim().split(/\r?\n/)
              .map((l) => l.split(",")[0]).filter((x) => x && x !== "openrouter_id");
            const prompts = fs.readdirSync("prompts/prompts/live").filter(f => f.endsWith(".md")).map(f => f.slice(0, -3));
            const hasRuns = (m) => prompts.every(p => {
              const path = `app/data/runs/${runId(p,m)}.json`;
              if (!fs.existsSync(path)) return false;
              const r = JSON.parse(fs.readFileSync(path, "utf8"));
              return r.status === "done" || (r.status === "failed" && Boolean(r.error));
            });
            const requested = (process.env.REQUESTED_MODEL || "").trim();
            if (requested && !live.includes(requested)) throw Error(`model is not in models/live.csv: ${requested}`);
            const todo = [...new Set(live)].filter((m) => (!requested || m === requested) && !hasRuns(m));
            console.log("new models:", todo.join(", ") || "(none)");
            fs.writeFileSync(process.env.GITHUB_OUTPUT, `models=${JSON.stringify(todo)}\n`, { flag: "a" });
          '

      - name: Kick orchestrator
        if: steps.diff.outputs.models != '[]'
        env:
          MODELS: ${{ steps.diff.outputs.models }}
          ORCH_URL: ${{ vars.ORCH_URL }}
          ORCH_TRIGGER_SECRET: ${{ secrets.ORCH_TRIGGER_SECRET }}
        run: |
          # Automatic pushes dedupe by model and prompt content even while the PR
          # is unmerged. Manual dispatch uses RUN_ID for a deliberate new execution;
          # RUN_ATTEMPT is excluded so reruns/retries retain the same request.
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync } from 'node:fs';
          import { parseFrontmatter } from './app/shared/frontmatter.js';
          const promptFiles = readdirSync('prompts/prompts/live').filter(p => p.endsWith('.md')).sort();
          const promptRevision = createHash('sha256').update(JSON.stringify(promptFiles.map(p => [p, readFileSync(`prompts/prompts/live/${p}`, 'utf8')]))).digest('hex');
          const prompts = promptFiles.map(file => {
            const { fm, body } = parseFrontmatter(readFileSync(`prompts/prompts/live/${file}`, 'utf8'));
            return { id: file.slice(0, -3), prompt: body, libs: fm.libs || [] };
          });
          const promptSetSha256 = createHash('sha256').update(JSON.stringify(prompts)).digest('hex');
          const models = JSON.parse(process.env.MODELS).sort();
          for (const model of models) {
            const body = JSON.stringify({ models: [model], prompts: prompts.map(p => p.id), promptSetSha256 });
            const suffix = createHash('sha256').update(body).digest('hex').slice(0, 16);
            const execution = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? process.env.GITHUB_RUN_ID : `automatic:${promptRevision}`;
            const key = `github:${process.env.GITHUB_REPOSITORY_ID}:${execution}:${suffix}`;
            let response;
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                response = await fetch(`${process.env.ORCH_URL}/run`, {
                  method: 'POST', signal: AbortSignal.timeout(60000),
                  headers: { authorization: `Bearer ${process.env.ORCH_TRIGGER_SECRET}`, 'content-type': 'application/json', 'Idempotency-Key': key }, body,
                });
                if (response.ok) { console.log(await response.text()); break; }
                if (response.status < 500 || attempt === 3) throw Error(`submission HTTP ${response.status}: ${await response.text()}`);
              } catch (error) { if (attempt === 3 || (response && response.status < 500)) throw error; }
              await new Promise(resolve => setTimeout(resolve, 5000 * (attempt + 1)));
            }
          }
          NODE
