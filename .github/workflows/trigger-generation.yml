name: trigger-generation
on:
  push:
    branches: [main]
    paths: ['models/live.csv', 'prompts/live/**']
  workflow_dispatch:
    inputs:
      before:
        description: Parent source revision before the additions
        required: true
      after:
        description: Source revision after the additions (defaults to selected ref)
        required: false
      refresh_model:
        description: Optional live model to refresh on all live prompts (requires attempt_id; before = after)
        required: false
      prompt_id:
        description: Diagnostic only - a single live prompt for a diagnostic run (never published)
        required: false
      attempt_id:
        description: Explicit 32-character lowercase hex ID; reuse for delivery retries
        required: false
      announce:
        description: Leave blank for the default; set to false to publish without a What's New post
        required: false
      retry_of:
        description: Recovery - parent batch ID; reruns only its recorded external failures (repeat the parent's other inputs)
        required: false
      diagnostic:
        description: Set to true for a diagnostic run (saved, never published; requires refresh_model and attempt_id)
        required: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Validate trigger behavior
        run: node --test .github/scripts/trigger-generation.test.ts
      - name: Submit immutable source change
        env:
          PIPELINE_URL: ${{ vars.PIPELINE_URL }}
          TRIGGER_SECRET: ${{ secrets.ORCH_TRIGGER_SECRET }}
          BEFORE: ${{ inputs.before || github.event.before }}
          AFTER: ${{ inputs.after || github.sha }}
          REFRESH_MODEL: ${{ inputs.refresh_model }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ANNOUNCE: ${{ inputs.announce }}
          RETRY_OF: ${{ inputs.retry_of }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: node .github/scripts/trigger-generation.ts
